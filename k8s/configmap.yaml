apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: queueless
  labels:
    app: backend
    app.kubernetes.io/name: queueless
data:
  PORT: "8000"
  NODE_ENV: "production"
  JWT_EXPIRES_IN: "7d"
  # Allowed CORS origins (browser origins accessing the frontend/backend)
  ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:30080,http://localhost:5173,http://localhost:8000"
