apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: queueless
  labels:
    app: frontend
    app.kubernetes.io/name: queueless
spec:
  # Type LoadBalancer automatically assigns localhost in Docker Desktop Kubernetes
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
